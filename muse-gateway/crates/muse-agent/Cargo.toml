[package]
name = "muse-agent"
version = "0.9.1"
edition = "2021"
description = "Muse agent loop — full Rust port of Muse2Api.Agent (.NET): tool-call parsing, workspace-jailed execution, approvals, chat turns."
license = "MIT"

[lib]
name = "muse_agent"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
chrono = "0.4"
hex = "0.4"
libc = "0.2"
async-trait = "0.1"
muse-store = { path = "../muse-store" }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

