[package]
name = "muse-browser"
version = "0.9.1"
edition = "2021"
description = "Browser driver for the Muse Rust backend — CDP (chromiumoxide) port of the .NET Playwright BrowserDriver, plus mock and http drivers (Drivers.cs)."
license = "MIT"

[dependencies]
muse-core = { path = "../muse-core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
futures-util = "0.3"
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"] }
chromiumoxide_cdp = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
base64 = "0.22"
regex = "1"
flate2 = "1"
httpdate = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
base64 = "0.22"

