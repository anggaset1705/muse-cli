[package]
name = "muse-gateway"
version = "0.9.1"
edition = "2021"
description = "Muse gateway — Rust backend for the Muse CLI desktop app. Integrated gateway: loopback HTTP, CORS loopback-only, full /v1/* + /admin/* + /v1/agent/* routes over muse-core/muse-store/muse-agent/muse-browser/muse-login/muse-screen."
license = "MIT"

[[bin]]
name = "muse-gateway"
path = "src/main.rs"

[dependencies]
muse-core = { path = "../muse-core" }
muse-store = { path = "../muse-store" }
muse-agent = { path = "../muse-agent" }
muse-browser = { path = "../muse-browser" }
muse-login = { path = "../muse-login" }
muse-screen = { path = "../muse-screen" }
axum = { version = "0.8", features = ["json", "multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
futures-util = "0.3"
async-trait = "0.1"
chrono = "0.4"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[build-dependencies]
# Embeds the application manifest (Common Controls v6) into muse-gateway.exe
# so the login window renders themed. Build is best-effort (see build.rs):
# without a resource compiler the sidecar muse-gateway.exe.manifest is used.
embed-resource = "3"
