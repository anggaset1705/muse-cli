<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muse CLI</title>
    <!-- Dark from the first paint: this inline style applies before any
         JS/CSS loads, so the window never flashes white on startup.
         #17171D is the app's main background; color-scheme: dark keeps
         native controls (scrollbars, form controls) dark too. -->
    <style>
      html,
      body {
        background: #17171D;
        color-scheme: dark;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
